<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="50%" stop-color="#2d5a8a"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
    
    <!-- Sun gradient -->
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e7"/>
      <stop offset="30%" stop-color="#ffd54f"/>
      <stop offset="70%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#ff6f00"/>
    </radialGradient>
    
    <!-- Cloud gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f0fe"/>
    </linearGradient>
    
    <!-- Leaf gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8bd66c"/>
      <stop offset="50%" stop-color="#5ac6ff"/>
      <stop offset="100%" stop-color="#4caf50"/>
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Soft shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#skyGrad)" filter="url(#softShadow)"/>
  
  <!-- Sun rays -->
  <g stroke="#ffd54f" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <line x1="50" y1="8" x2="50" y2="14"/>
    <line x1="50" y1="86" x2="50" y2="92"/>
    <line x1="8" y1="50" x2="14" y2="50"/>
    <line x1="86" y1="50" x2="92" y2="50"/>
    <line x1="18" y1="18" x2="23" y2="23"/>
    <line x1="77" y1="77" x2="82" y2="82"/>
    <line x1="18" y1="82" x2="23" y2="77"/>
    <line x1="77" y1="23" x2="82" y2="18"/>
  </g>
  
  <!-- Cloud -->
  <g filter="url(#softShadow)">
    <ellipse cx="38" cy="42" rx="16" ry="10" fill="url(#cloudGrad)"/>
    <ellipse cx="52" cy="38" rx="14" ry="12" fill="url(#cloudGrad)"/>
    <ellipse cx="64" cy="42" rx="12" ry="9" fill="url(#cloudGrad)"/>
    <ellipse cx="48" cy="48" rx="18" ry="8" fill="url(#cloudGrad)"/>
  </g>
  
  <!-- Sun -->
  <circle cx="72" cy="28" r="16" fill="url(#sunGrad)" filter="url(#glow)"/>
  
  <!-- Leaf/Plant - representing agriculture/farmer focus -->
  <g transform="translate(22, 68) rotate(-15)">
    <path d="M0,0 Q-8,-12 -4,-24 Q0,-28 4,-24 Q12,-12 0,0" fill="url(#leafGrad)" filter="url(#softShadow)"/>
    <path d="M0,0 Q-4,-6 -2,-12 Q0,-14 2,-12 Q6,-6 0,0" fill="#4caf50" opacity="0.8"/>
    <!-- Leaf vein -->
    <path d="M0,0 L0,-22" stroke="#2e7d32" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  </g>
  
  <!-- Small leaf -->
  <g transform="translate(18, 78) rotate(25) scale(0.6)">
    <path d="M0,0 Q-8,-12 -4,-24 Q0,-28 4,-24 Q12,-12 0,0" fill="url(#leafGrad)" filter="url(#softShadow)"/>
    <path d="M0,0 Q-4,-6 -2,-12 Q0,-14 2,-12 Q6,-6 0,0" fill="#4caf50" opacity="0.8"/>
    <path d="M0,0 L0,-22" stroke="#2e7d32" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  </g>
  
  <!-- Water droplet - representing marine/humidity -->
  <g transform="translate(80, 70)" opacity="0.9">
    <path d="M0,-8 Q8,0 0,12 Q-8,0 0,-8" fill="#5ac6ff" filter="url(#glow)"/>
    <ellipse cx="0" cy="-4" rx="1.5" ry="1" fill="#fff" opacity="0.6"/>
  </g>
  
  <!-- Wind lines - representing aviation/wind -->
  <g stroke="#7e8cff" stroke-width="1.2" stroke-linecap="round" opacity="0.5">
    <path d="M78,58 Q84,56 90,58"/>
    <path d="M78,62 Q84,60 90,62"/>
    <path d="M78,66 Q84,64 90,66"/>
  </g>
  
  <!-- W letter mark - subtle brand -->
  <text x="50" y="88" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" opacity="0.15">W</text>
</svg>